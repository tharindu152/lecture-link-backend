server:
  port: ${SERVER_PORT:8070}
spring:
  application:
    name: eurekaserver
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"
eureka:
  instance:
    hostname: ${EUREKA_HOST:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
