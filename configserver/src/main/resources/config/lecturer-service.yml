server:
  port: ${SERVER_PORT:9000}
spring:
  application:
    name: lecturer-service
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:7080/realms/lecturelink}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:7080/realms/lecturelink/protocol/openid-connect/certs}
application:
  title: LectureLink
  ai-match:
    url: ${AI_MATCH_URL:http://localhost:5000}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}
info:
  app:
    name: lecturer-service
    description: LectureLink lecturers and qualifications
    version: 1.0.0
